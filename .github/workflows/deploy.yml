name: Kontrola a nasazení ITWORKSHOP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kontrola webu
    runs-on: ubuntu-latest
    steps:
      - name: Získat zdrojový kód
        uses: actions/checkout@v7
      - name: Nastavit Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Nainstalovat závislosti
        run: npm ci
      - name: Zkontrolovat Astro a TypeScript
        run: npm run check
      - name: Otestovat čistou logiku
        run: npm test
      - name: Sestavit web a český index Pagefind
        run: npm run build
      - name: Prověřit lokální odkazy
        run: npm run check:links
      - name: Připravit Chromium pro Playwright
        run: npx playwright install --with-deps chromium
      - name: Ověřit stránky a Pagefind na produkčním náhledu
        run: npm run test:e2e:preview
      - name: Předat výstup nasazení
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: itworkshop-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Nasadit na GitHub Pages
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stáhnout ověřený build
        uses: actions/download-artifact@v8
        with:
          name: itworkshop-dist
          path: dist
      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v6
      - name: Nahrát Pages artefakt
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Zveřejnit ověřený build
        id: deployment
        uses: actions/deploy-pages@v5
