<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz ITWORKSHOP</title><style>body{font:17px/1.5 system-ui;color:#17304d;max-width:760px;margin:auto;padding:20px}fieldset{border:1px solid #b9c9df;border-radius:10px;margin:16px 0;padding:15px}label{display:block;padding:6px}button{font:inherit;background:#073798;color:white;padding:10px 16px;border:0;border-radius:6px}button:focus-visible,input:focus-visible{outline:3px solid #00a7d1}output{display:block;margin:15px 0;font-weight:bold}</style><h1>Ověř si znalosti</h1><form id="quiz"></form><output id="result" aria-live="polite"></output><script>const qs=[["Co je prompt?", ["Textové zadání", "Zvuková karta", "Název souboru"], 0, "Prompt popisuje požadovaný výstup."], ["Co znamená instrumental?", ["Bez zpěvu", "Bez rytmu", "Bez nástrojů"], 0, "Instrumentální skladba neobsahuje požadovaný zpěv."], ["Proč porovnávat více výsledků?", ["AI vždy tvoří stejně", "AI může vytvářet různé varianty", "Kvůli velikosti monitoru"], 1, "Výsledky se mohou lišit i při stejném zadání."], ["Smíš automaticky komerčně použít bezplatný výstup?", ["Ano", "Ne", "Jen pokud je krátký"], 1, "Je nutné respektovat licenci a podmínky služby."]];const form=document.querySelector('#quiz');qs.forEach(([q,a,c,e],i)=>{let f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent=(i+1)+'. '+q;f.append(l);a.forEach((v,j)=>{let label=document.createElement('label'),r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;r.required=true;label.append(r,document.createTextNode(' '+v));f.append(label)});let p=document.createElement('p');p.id='feedback'+i;f.append(p);form.append(f)});let b=document.createElement('button');b.textContent='Vyhodnotit';form.append(b);form.onsubmit=e=>{e.preventDefault();let data=new FormData(form),n=0;qs.forEach(([q,a,c,ex],i)=>{let ok=Number(data.get('q'+i))===c;n+=ok?1:0;document.querySelector('#feedback'+i).textContent=(ok?'Správně. ':'Nesprávně. ')+ex});document.querySelector('#result').textContent='Výsledek: '+n+' / '+qs.length};</script></html>
