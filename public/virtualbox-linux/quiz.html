<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kvíz – VirtualBox a Linux</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Kvíz – VirtualBox a Linux</h1><form id="quiz"><fieldset><legend>1. Co je hostitel?</legend><label><input type="radio" name="q0" value="0" required> Fyzický počítač a jeho OS</label><label><input type="radio" name="q0" value="1" required> ISO soubor</label><label><input type="radio" name="q0" value="2" required> Virtuální disk</label><p id="f0" aria-live="polite"></p></fieldset><fieldset><legend>2. Co je ISO?</legend><label><input type="radio" name="q1" value="0" required> Paměť RAM</label><label><input type="radio" name="q1" value="1" required> Obraz instalačního média</label><label><input type="radio" name="q1" value="2" required> Snímek stavu</label><p id="f1" aria-live="polite"></p></fieldset><fieldset><legend>3. Co je VDI?</legend><label><input type="radio" name="q2" value="0" required> Virtuální disk</label><label><input type="radio" name="q2" value="1" required> Síťový kabel</label><label><input type="radio" name="q2" value="2" required> Grafická karta</label><p id="f2" aria-live="polite"></p></fieldset><fieldset><legend>4. Kdy lze zvolit vymazání disku?</legend><label><input type="radio" name="q3" value="0" required> Vždy</label><label><input type="radio" name="q3" value="1" required> Na fyzickém PC</label><label><input type="radio" name="q3" value="2" required> Pouze po ověření nového prázdného VDI ve VM</label><p id="f3" aria-live="polite"></p></fieldset><fieldset><legend>5. Co je Live režim?</legend><label><input type="radio" name="q4" value="0" required> Spuštění systému z instalačního média</label><label><input type="radio" name="q4" value="1" required> Aktualizace Windows</label><label><input type="radio" name="q4" value="2" required> Obnova snímku</label><p id="f4" aria-live="polite"></p></fieldset><fieldset><legend>6. Co dělá ls?</legend><label><input type="radio" name="q5" value="0" required> Vypne Linux</label><label><input type="radio" name="q5" value="1" required> Vypíše soubory</label><label><input type="radio" name="q5" value="2" required> Vytvoří adresář</label><p id="f5" aria-live="polite"></p></fieldset><fieldset><legend>7. Co se může stát po obnově snímku?</legend><label><input type="radio" name="q6" value="0" required> Zvětší se RAM</label><label><input type="radio" name="q6" value="1" required> Ztratí se pozdější změny</label><label><input type="radio" name="q6" value="2" required> Vždy vznikne záloha</label><p id="f6" aria-live="polite"></p></fieldset><fieldset><legend>8. Co znamená NAT?</legend><label><input type="radio" name="q7" value="0" required> Přístup přes překlad síťových adres</label><label><input type="radio" name="q7" value="1" required> Druh paměti</label><label><input type="radio" name="q7" value="2" required> Instalační médium</label><p id="f7" aria-live="polite"></p></fieldset><fieldset><legend>9. Co dělat při vypnuté virtualizaci ve škole?</legend><label><input type="radio" name="q8" value="0" required> Vypnout zabezpečení</label><label><input type="radio" name="q8" value="1" required> Požádat správce</label><label><input type="radio" name="q8" value="2" required> Smazat Windows</label><p id="f8" aria-live="polite"></p></fieldset><fieldset><legend>10. Který příkaz zobrazí aktuální adresář?</legend><label><input type="radio" name="q9" value="0" required> cat</label><label><input type="radio" name="q9" value="1" required> cp</label><label><input type="radio" name="q9" value="2" required> pwd</label><p id="f9" aria-live="polite"></p></fieldset><button>Vyhodnotit</button><button type="reset">Znovu</button><output id="score" aria-live="polite"></output></form></main><script src="quiz.js" defer></script></body></html>
