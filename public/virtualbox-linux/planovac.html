<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Plánovač virtuálního počítače</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Plánovač virtuálního počítače</h1><p>Modelový výpočet, nikoli skutečná diagnostika. Zadej parametry počítače a plánované VM.</p><label>RAM hostitele (GB) <input id="host" type="number" min="1" max="256" value="16"></label><label>RAM VM (GB) <input id="guest" type="number" min="1" max="256" value="4"></label><label>Volné místo (GB) <input id="free" type="number" min="0" value="80"></label><label>Maximální kapacita VDI (GB) <input id="disk" type="number" min="1" value="35"></label><button id="calc">Vyhodnotit</button><output id="result" aria-live="polite"></output></main><script src="planovac.js" defer></script></body></html>
