<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz HTML a CSS</title><style>body{font:16px system-ui;max-width:760px;margin:24px auto;padding:16px;color:#172b45}fieldset{margin:12px 0;padding:14px}label{display:block;padding:6px}button{padding:10px;font:inherit}</style><h1>Kvíz HTML a CSS</h1><form id="q"><fieldset><legend>1. Co určuje HTML?</legend><label><input required type="radio" name="q0" value="0"> Vzhled</label><label><input required type="radio" name="q0" value="1"> Strukturu a obsah</label><label><input required type="radio" name="q0" value="2"> Rychlost internetu</label></fieldset><fieldset><legend>2. Která značka vytváří odkaz?</legend><label><input required type="radio" name="q1" value="0"> a</label><label><input required type="radio" name="q1" value="1"> img</label><label><input required type="radio" name="q1" value="2"> p</label></fieldset><fieldset><legend>3. K čemu slouží alt?</legend><label><input required type="radio" name="q2" value="0"> K popisu obrázku</label><label><input required type="radio" name="q2" value="1"> K nastavení barvy</label><label><input required type="radio" name="q2" value="2"> K vložení tabulky</label></fieldset><fieldset><legend>4. Který prvek vytváří číslovaný seznam?</legend><label><input required type="radio" name="q3" value="0"> ul</label><label><input required type="radio" name="q3" value="1"> ol</label><label><input required type="radio" name="q3" value="2"> li</label></fieldset><fieldset><legend>5. Co označuje tr?</legend><label><input required type="radio" name="q4" value="0"> Buňku</label><label><input required type="radio" name="q4" value="1"> Tabulku</label><label><input required type="radio" name="q4" value="2"> Řádek tabulky</label></fieldset><fieldset><legend>6. Jak připojíme CSS?</legend><label><input required type="radio" name="q5" value="0"> link v head</label><label><input required type="radio" name="q5" value="1"> img v body</label><label><input required type="radio" name="q5" value="2"> title</label></fieldset><fieldset><legend>7. Co určuje padding?</legend><label><input required type="radio" name="q6" value="0"> Vnější mezeru</label><label><input required type="radio" name="q6" value="1"> Vnitřní odsazení</label><label><input required type="radio" name="q6" value="2"> Barvu</label></fieldset><fieldset><legend>8. Jak vybíráme třídu karta?</legend><label><input required type="radio" name="q7" value="0"> #karta</label><label><input required type="radio" name="q7" value="1"> .karta</label><label><input required type="radio" name="q7" value="2"> karta()</label></fieldset><button>Vyhodnotit</button> <button type="reset">Znovu</button></form><p id="result" aria-live="polite"></p><script>const keys=[1, 0, 0, 1, 2, 0, 1, 1];const f=document.querySelector('#q'),r=document.querySelector('#result');f.onsubmit=e=>{e.preventDefault();const d=new FormData(f);let n=0;keys.forEach((k,i)=>{const ok=Number(d.get('q'+i))===k;n+=ok;f.elements['q'+i][0].closest('fieldset').style.borderColor=ok?'green':'red'});r.textContent='Výsledek: '+n+' / '+keys.length};f.onreset=()=>{r.textContent='';f.querySelectorAll('fieldset').forEach(x=>x.style.borderColor='')};</script></html>
